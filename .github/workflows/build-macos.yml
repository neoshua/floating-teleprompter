name: Build macOS

# macOS 包必须在 macOS 上构建：Electron 的 .app 依赖符号链接和 Unix 可执行位，
# 在 Windows 上交叉打包会得到一个打不开的 .app。
#   · 手动触发：Actions → Build macOS → Run workflow
#   · 每个架构的 Artifact 同时包含 .dmg（推荐，拖拽安装）和 .zip（绿色版备选）
#
# 【为什么发布 Release 时不再自动挂附件】
# latest.json 里写死了 DMG 的 SHA-256。若 Release 发布后 CI 再构建一次并
# --clobber 覆盖，两次产出的 DMG 不是同一份，客户端校验就会失败。
# 因此统一流程是：维护者先跑本工作流 → 下载 Artifact → 本地生成 latest.json
# → 把 DMG / zip / 补丁 / latest.json 一次性上传到 Release。
on:
  workflow_dispatch:
    inputs:
      arch:
        description: '要构建的架构'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - arm64
          - x64

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.pick.outputs.arch }}
    steps:
      - id: pick
        env:
          REQUESTED: ${{ inputs.arch }}
        run: |
          case "$REQUESTED" in
            arm64) echo 'arch=["arm64"]' >> "$GITHUB_OUTPUT" ;;
            x64)   echo 'arch=["x64"]' >> "$GITHUB_OUTPUT" ;;
            *)     echo 'arch=["arm64","x64"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: matrix
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.matrix.outputs.arch) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # vendor/vosk.js 与 43MB 离线模型由 setup.mjs 生成，不入库；
      # 缓存起来避免每次重新从 alphacephei.com 下载。
      - name: Restore generated assets
        uses: actions/cache@v4
        with:
          path: |
            assets/model.tar.gz
            vendor/vosk.js
          key: tp-assets-${{ hashFiles('package-lock.json') }}-v1

      - name: Generate vendor and offline model
        run: node scripts/setup.mjs

      - name: Generate macOS icons
        run: node scripts/make-mac-assets.js

      - name: Build .app and distributable zip
        run: node scripts/pack.js --platform darwin --arch ${{ matrix.arch }}

      - name: Verify the .app survives unzip
        run: |
          set -euo pipefail
          ZIP="dist/FloatingTeleprompter-mac-${{ matrix.arch }}.zip"
          test -s "$ZIP"
          unzip -t "$ZIP" | tail -2
          rm -rf /tmp/tp-verify && mkdir -p /tmp/tp-verify
          unzip -q "$ZIP" -d /tmp/tp-verify
          APP="$(find /tmp/tp-verify -maxdepth 2 -name '飓风提词器.app' -print -quit)"
          test -n "$APP" || { echo "ASSERT_FAIL .app 未找到"; find /tmp/tp-verify -maxdepth 3 | head -30; exit 1; }
          echo "APP=$APP"
          echo "--- Contents/Resources ---"
          ls -1 "$APP/Contents/Resources" | head -40
          echo "--- Contents/MacOS ---"
          ls -l "$APP/Contents/MacOS"
          test -x "$APP/Contents/MacOS/飓风提词器" || { echo "ASSERT_FAIL 主二进制不可执行"; exit 1; }
          test -f "$APP/Contents/Resources/app/main.js" || { echo "ASSERT_FAIL 缺 main.js"; exit 1; }
          test -f "$APP/Contents/Resources/app/updater.js" || { echo "ASSERT_FAIL 缺 updater.js"; exit 1; }
          test -f "$APP/Contents/Resources/app/assets/trayTemplate.png" || { echo "ASSERT_FAIL 缺 trayTemplate.png"; exit 1; }
          ICNS="$(find "$APP/Contents/Resources" -maxdepth 1 -name '*.icns' -print -quit)"
          test -n "$ICNS" || { echo "ASSERT_FAIL Resources 下没有 .icns 图标"; exit 1; }
          grep -q 'NSMicrophoneUsageDescription' "$APP/Contents/Info.plist" || { echo "ASSERT_FAIL Info.plist 缺麦克风用途说明"; exit 1; }
          LINKS="$(find "$APP/Contents/Frameworks" -type l | wc -l | tr -d ' ')"
          test "$LINKS" -gt 0 || { echo "ASSERT_FAIL Frameworks 符号链接丢失 ($LINKS)"; exit 1; }
          # v1.0.3 的「已损坏，移到废纸篓」就是缺这一步：zip 里的 .app 必须
          # 带一份有效的 ad-hoc 签名和完整的 CodeResources 封印资源。
          test -f "$APP/Contents/_CodeSignature/CodeResources" || { echo "ASSERT_FAIL 缺签名封印资源"; exit 1; }
          codesign --verify --deep --verbose=1 "$APP" 2>&1 || { echo "ASSERT_FAIL 解压后签名无效"; exit 1; }
          codesign -dvvv "$APP" 2>&1 | grep -qi 'Signature=adhoc' || { echo "ASSERT_FAIL 不是 ad-hoc 签名"; exit 1; }
          echo "APP_OK | icon=$ICNS | symlinks=$LINKS | adhoc_signature=valid"
          shasum -a 256 "$ZIP"

      - name: Build drag-to-Applications DMG and verify
        run: bash scripts/make-dmg.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/FloatingTeleprompter-mac-${{ matrix.arch }}.dmg
            dist/FloatingTeleprompter-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
